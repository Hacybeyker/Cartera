  /billers/{billerId}/debts:
    get:
      tags: [bills]
      operationId: listBillerDebts
      summary: Recibos pendientes de un cliente de una empresa.
      description: |
        Validado en este orden:
        1. La empresa existe (404 `BILLER_NOT_FOUND`).
        2. `customerCode` cumple el `customerCodeFormat` de la empresa e `includeHistory` es `true` o
           `false` (422 `VALIDATION_ERROR`, un elemento en `errors[]` por campo).
        3. El código existe en esa empresa (404 `CUSTOMER_NOT_FOUND`).

        Los recibos ya pagados no aparecen. Un cliente sin recibos pendientes da 200 con `debts: []`.

        Con `includeHistory=true` la respuesta añade `history`: el histórico de facturación de los últimos
        24 meses, del más antiguo al más reciente, con el detalle por concepto de cada mes. Si la
        empresa no lleva histórico del cliente, `history` viene vacío. Sin el parámetro, o con `false`,
        el campo no se envía.
      parameters:
        - $ref: "#/components/parameters/BillerId"
        - name: customerCode
          in: query
          required: true
          description: Código del cliente en la empresa; debe cumplir su `customerCodeFormat`.
          schema: { type: string, examples: ["100200"] }
        - name: includeHistory
          in: query
          description: Añade el histórico de facturación de los últimos 24 meses.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Recibos pendientes.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillerDebts" }
              examples:
                luzDelNorte:
                  summary: "Dos recibos pendientes de Luz del Norte (código 100200)."
                  value:
                    customerName: "Ana Torres"
                    debts:
                      - id: "DEB-LUZ-202610"
                        period: "2026-10"
                        dueDate: "2026-11-12"
                        amount: { value: "85.40", currency: "PEN" }
                      - id: "DEB-LUZ-202611"
                        period: "2026-11"
                        dueDate: "2026-12-12"
                        amount: { value: "92.10", currency: "PEN" }
                sinRecibos:
                  summary: "Internet Moche (código 700800), sin recibos pendientes."
                  value: { customerName: "Ana Torres", debts: [] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`BILLER_NOT_FOUND` o `CUSTOMER_NOT_FOUND` (el código no existe en esa empresa)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                clienteNoExiste:
                  summary: "El código no existe en la empresa."
                  value:
                    type: "https://cartera.invalid/problems/customer-not-found"
                    title: "Cliente no encontrado"
                    status: 404
                    detail: "No existe el código 999999 en Luz del Norte."
                    code: "CUSTOMER_NOT_FOUND"
                    traceId: "req-000001"
                empresaNoExiste:
                  summary: "La empresa no existe."
                  value:
                    type: "https://cartera.invalid/problems/biller-not-found"
                    title: "Empresa no encontrada"
                    status: 404
                    detail: "No existe la empresa BIL-XXX."
                    code: "BILLER_NOT_FOUND"
                    traceId: "req-000001"
        "422":
          description: "`VALIDATION_ERROR` (con `errors[]`): campos `customerCode` e `includeHistory`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                datosInvalidos:
                  summary: "Código con otro formato e `includeHistory` inválido."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "La consulta tiene datos inválidos."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors:
                      - field: "customerCode"
                        code: "INVALID_FORMAT"
                        message: "El código no cumple el formato de la empresa."
                      - { field: "includeHistory", code: "INVALID_VALUE", message: "Usa true o false." }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bill-payments:
    post:
      tags: [bills]
      operationId: createBillPayment
      summary: Paga recibos de una empresa con una cuenta propia en soles.
      description: |
        **Regla de negocio**, validada en este orden:
        1. `Idempotency-Key` presente y cuerpo válido: `billerId` existente, `customerCode` con el formato
           de la empresa, `debtIds` con al menos un id de recibo sin repetir, `accountId` y `pin` de
           4 dígitos (`VALIDATION_ERROR`).
        2. La cuenta es propia (`VALIDATION_ERROR`, campo `accountId`) y está en soles (`CURRENCY_MISMATCH`).
        3. `pin` es la clave de operaciones de la persona (`INVALID_PIN`).
        4. El código existe en la empresa y todos los recibos son de ese cliente (`VALIDATION_ERROR`,
           campos `customerCode` y `debtIds`), y ninguno está pagado (`DEBT_ALREADY_PAID`; no se cobra
           ninguno).
        5. Total ≤ saldo disponible de la cuenta (`INSUFFICIENT_FUNDS`).

        Si pasa, se debita el total de la cuenta, los recibos quedan pagados y se agrega un movimiento
        `SERVICES` `DEBIT` ("Pago de <empresa>") al inicio de la cuenta, con un recibo por línea de
        desglose. Sin comisiones ni impuestos. El número de operación es consecutivo, desde `80000001`.

        Un `Idempotency-Key` repetido devuelve la misma respuesta 201 sin volver a cobrar. Las
        respuestas de error no se guardan: el mismo key se puede reintentar.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillPaymentRequest" }
            examples:
              pagoDeReferencia:
                summary: "Los dos recibos de Luz del Norte desde Cuenta Gastos."
                value:
                  billerId: "BIL-LUZ"
                  customerCode: "100200"
                  debtIds: ["DEB-LUZ-202610", "DEB-LUZ-202611"]
                  accountId: "ACC-002"
                  pin: "1234"
      responses:
        "201":
          description: Pago hecho.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillPaymentResponse" }
              examples:
                pagoDeReferencia:
                  summary: "El primer pago desde datos limpios: operación 80000001 y saldo 2122.50."
                  value:
                    paymentId: "PAY-000001"
                    operationNumber: "80000001"
                    createdAt: "2026-11-07T10:00:00-05:00"
                    paidDebts:
                      - { id: "DEB-LUZ-202610", period: "2026-10", amount: { value: "85.40", currency: "PEN" } }
                      - { id: "DEB-LUZ-202611", period: "2026-11", amount: { value: "92.10", currency: "PEN" } }
                    total: { value: "177.50", currency: "PEN" }
                    accountId: "ACC-002"
                    accountAvailableBalance: { value: "2122.50", currency: "PEN" }
                    movementId: "MOV-002-P0001"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: |
            `VALIDATION_ERROR` (con `errors[]`), `CURRENCY_MISMATCH`, `INVALID_PIN`,
            `DEBT_ALREADY_PAID` o `INSUFFICIENT_FUNDS`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                claveInvalida:
                  summary: "La clave de operaciones no es la de la persona."
                  value:
                    type: "https://cartera.invalid/problems/invalid-pin"
                    title: "Clave de operaciones inválida"
                    status: 422
                    detail: "La clave de operaciones es incorrecta."
                    code: "INVALID_PIN"
                    traceId: "req-000001"
                reciboYaPagado:
                  summary: "Alguno de los recibos ya está pagado; no se cobra ninguno."
                  value:
                    type: "https://cartera.invalid/problems/debt-already-paid"
                    title: "Recibo ya pagado"
                    status: 422
                    detail: "Ya se pagó: DEB-LUZ-202610, DEB-LUZ-202611."
                    code: "DEBT_ALREADY_PAID"
                    traceId: "req-000001"
                saldoInsuficiente:
                  summary: "El total supera el saldo disponible."
                  value:
                    type: "https://cartera.invalid/problems/insufficient-funds"
                    title: "Saldo insuficiente"
                    status: 422
                    detail: "El total supera el saldo disponible."
                    code: "INSUFFICIENT_FUNDS"
                    traceId: "req-000001"
                monedasDistintas:
                  summary: "La cuenta de cargo está en dólares."
                  value:
                    type: "https://cartera.invalid/problems/currency-mismatch"
                    title: "Las monedas no coinciden"
                    status: 422
                    detail: "Los recibos se pagan con una cuenta en soles."
                    code: "CURRENCY_MISMATCH"
                    traceId: "req-000001"
                datosInvalidos:
                  summary: "Sin recibos y con una clave de menos de 4 dígitos."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "El pago tiene datos inválidos."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors:
                      - { field: "debtIds", code: "MIN_ITEMS", message: "Elige al menos un recibo." }
                      - { field: "pin", code: "INVALID_FORMAT", message: "Usa 4 dígitos." }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bill-payments/{paymentId}/voucher:
    get:
      tags: [bills]
      operationId: getBillPaymentVoucher
      summary: Constancia de un pago, en HTML.
      description: |
        Una página HTML simple y semántica, sin scripts, en español: número de operación, fecha, empresa,
        cliente, cuenta de cargo, los recibos pagados (período e importe), el total y el saldo disponible
        que dejó el pago. Los montos van con formato de soles (`S/ 2,122.50`). La constancia no cambia
        aunque la cuenta se mueva después.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Constancia.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            text/html:
              schema: { type: string }
              examples:
                constancia:
                  summary: "La constancia del pago de referencia."
                  value: |
                    <!DOCTYPE html>
                    <html lang="es">
                    <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
                    <title>Constancia de pago</title>
                    <style>:root{color-scheme:light dark}body{font-family:sans-serif;margin:16px;line-height:1.4}h1{font-size:1.25rem;margin:0 0 16px}dl{margin:0 0 16px}dt{font-size:.8rem;opacity:.7;margin-top:12px}dd{margin:2px 0 0}table{width:100%;border-collapse:collapse}caption{text-align:left;font-weight:bold;padding-bottom:8px}th,td{padding:8px 0;border-bottom:1px solid rgba(128,128,128,.4);text-align:left}td:last-child,th:last-child{text-align:right}</style>
                    </head>
                    <body>
                    <main>
                    <h1>Constancia de pago</h1>
                    <dl>
                    <dt>Número de operación</dt><dd>80000001</dd>
                    <dt>Fecha y hora</dt><dd>07/11/2026 10:00</dd>
                    <dt>Empresa</dt><dd>Luz del Norte</dd>
                    <dt>Cliente</dt><dd>Ana Torres</dd>
                    <dt>Código de cliente</dt><dd>100200</dd>
                    <dt>Cuenta de cargo</dt><dd>Cuenta Gastos ****9034</dd>
                    </dl>
                    <table>
                    <caption>Recibos pagados</caption>
                    <thead><tr><th scope="col">Período</th><th scope="col">Importe</th></tr></thead>
                    <tbody>
                    <tr><td>Octubre 2026</td><td>S/ 85.40</td></tr>
                    <tr><td>Noviembre 2026</td><td>S/ 92.10</td></tr>
                    </tbody>
                    <tfoot>
                    <tr><th scope="row">Total pagado</th><td>S/ 177.50</td></tr>
                    </tfoot>
                    </table>
                    <dl>
                    <dt>Nuevo saldo disponible</dt><dd>S/ 2,122.50</dd>
                    </dl>
                    </main>
                    </body>
                    </html>
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`PAYMENT_NOT_FOUND`: el pago no existe o no es de la persona."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                pagoNoExiste:
                  summary: "El pago no existe o no es de la persona."
                  value:
                    type: "https://cartera.invalid/problems/payment-not-found"
                    title: "Pago no encontrado"
                    status: 404
                    detail: "No existe el pago PAY-999999."
                    code: "PAYMENT_NOT_FOUND"
                    traceId: "req-000001"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/biometric/enroll:
    post:
      tags: [biometric]
      operationId: enrollBiometric
      summary: Registra el dispositivo para ingresar con huella.
      description: |
        Devuelve un `deviceToken` opaco que el servidor recuerda para la persona, también tras reiniciarse.
        Cada registro crea uno nuevo; los anteriores siguen vigentes hasta `DELETE /auth/biometric`.
      responses:
        "201":
          description: Dispositivo registrado.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BiometricEnrollResponse" }
              examples:
                dispositivo:
                  summary: "El token opaco del dispositivo."
                  value: { deviceToken: "dvc_ehQmzxWS8oJ2E8sLKbzQyV3xFhypUXuoTFwe19wbbmc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/biometric/login:
    post:
      tags: [biometric]
      operationId: loginBiometric
      summary: Inicia sesión con el token del dispositivo.
      description: Responde igual que `POST /auth/login`, con el mismo TTL.
      security: []
      parameters:
        - $ref: "#/components/parameters/DemoSessionTtl"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiometricLoginRequest" }
            examples:
              dispositivo:
                summary: "El token que entregó el registro."
                value: { deviceToken: "dvc_ehQmzxWS8oJ2E8sLKbzQyV3xFhypUXuoTFwe19wbbmc" }
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                sesion:
                  summary: "Misma forma que el login."
                  value:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJVU1ItMDAxIiwiaWF0IjoxNzk0MDYzNjAwLCJleHAiOjE3OTQwNjQ1MDB9.ZTHmmPDY0J0Oh53Tvhrp4fnRUEiYRh0b2aurJ1CyrVQ"
                    tokenType: "Bearer"
                    expiresIn: 900
        "401":
          description: "`INVALID_DEVICE`: el token no existe o fue revocado."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                dispositivoInvalido:
                  summary: "El token no existe o fue revocado."
                  value:
                    type: "https://cartera.invalid/problems/invalid-device"
                    title: "Dispositivo no registrado"
                    status: 401
                    detail: "El dispositivo no está registrado. Ingresa con tu clave."
                    code: "INVALID_DEVICE"
                    traceId: "req-000001"
        "422":
          description: "`VALIDATION_ERROR`, con un elemento en `errors[]` por campo."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                tokenObligatorio:
                  summary: "Falta `deviceToken`."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "Falta el token del dispositivo."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors: [{ field: "deviceToken", code: "REQUIRED", message: "El campo es obligatorio." }]
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/biometric:
    delete:
      tags: [biometric]
      operationId: deleteBiometric
      summary: Revoca todos los dispositivos registrados de la persona.
      description: |
        Borra todos los dispositivos registrados de la persona, no solo el de quien llama. Después, el
        `deviceToken` de cualquiera de ellos da `INVALID_DEVICE` en `POST /auth/biometric/login`.
      responses:
        "204":
          description: Dispositivos revocados.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /_demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      summary: Vuelve el estado a los fixtures. Solo existe en entornos de demo.
      description: |
        Solo para entornos de demo: borra lo que el servidor guardó (saldos, movimientos nuevos, tenencias,
        cotizaciones, pagos, idempotencia y dispositivos) y vuelve a los fixtures. Un servidor real no debe
        implementarlo. No pide token ni aplica ninguna cabecera `X-Demo-*`.
      security: []
      responses:
        "204":
          description: Estado restablecido.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Id de la solicitud; coincide con `traceId` en los errores.
      schema: { type: string, examples: ["req-000001"] }
  parameters:
    MovementId:
      name: movementId
      in: path
      required: true
      schema: { type: string, examples: ["MOV-002-0001"] }
    DemoSessionTtl:
      name: X-Demo-Session-Ttl
      in: header
      description: Solo entornos de demo. TTL en segundos del token emitido.
      schema: { type: integer, minimum: 1, examples: [60] }
    DemoQuoteTtl:
      name: X-Demo-Quote-Ttl-S
      in: header
      description: Solo entornos de demo. Vigencia en segundos de la cotización emitida.
      schema: { type: integer, minimum: 1, default: 30, examples: [5] }
    BillerId:
      name: billerId
      in: path
      required: true
      schema: { type: string, examples: ["BIL-LUZ"] }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, examples: ["PAY-000001"] }
    Symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string, examples: ["ANDM"] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Por usuario y por operación; ver Idempotencia en la descripción general.
      schema: { type: string, examples: ["3f1c2a9e-7d4b-4b8e-9c55-1a2b3c4d5e6f"] }
  responses:
    Unauthorized:
      description: "`SESSION_EXPIRED` si el token venció; `UNAUTHORIZED` si falta o no es válido."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            sesionExpirada:
              summary: "El token venció."
              value:
                type: "https://cartera.invalid/problems/session-expired"
                title: "Sesión expirada"
                status: 401
                detail: "La sesión expiró. Vuelve a ingresar."
                code: "SESSION_EXPIRED"
                traceId: "req-000001"
            sinToken:
              summary: "Falta el token o no es válido."
              value:
                type: "https://cartera.invalid/problems/unauthorized"
                title: "No autorizado"
                status: 401
                detail: "Falta un token válido."
                code: "UNAUTHORIZED"
                traceId: "req-000001"
    InternalError:
      description: "`INTERNAL_ERROR`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            errorInterno:
              summary: "Fallo del servidor."
              value:
                type: "https://cartera.invalid/problems/internal-error"
                title: "Error interno"
                status: 500
                detail: "Ocurrió un error inesperado. Reintenta en unos instantes."
                code: "INTERNAL_ERROR"
                traceId: "req-000001"
    ServiceUnavailable:
      description: "`SERVICE_UNAVAILABLE`: backend caído."
      headers:
        Retry-After:
          schema: { type: integer, examples: [30] }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            servicioCaido:
              summary: "Backend caído; trae `Retry-After`."
              value:
                type: "https://cartera.invalid/problems/service-unavailable"
                title: "Servicio no disponible"
                status: 503
                detail: "El servicio no está disponible."
                code: "SERVICE_UNAVAILABLE"
                traceId: "req-000001"
  schemas:
    Money:
      type: object
      required: [value, currency]
      properties:
        value: { type: string, pattern: "^-?\\d+\\.\\d{2}$", examples: ["150.00"] }
        currency: { type: string, pattern: "^[A-Z]{3}$", examples: ["PEN"] }
    AppConfig:
      type: object
      required: [minSupportedVersion, termsVersion]
      properties:
        minSupportedVersion: { type: string, examples: ["0.1.0"] }
        termsVersion: { type: string, examples: ["2026-11-01"] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, examples: ["ana.torres"] }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vida del token., examples: [900] }
    Me:
      type: object
      required: [id, fullName, documentMasked, email]
      properties:
        id: { type: string, examples: ["USR-001"] }
        fullName: { type: string, examples: ["Ana Torres"] }
        documentMasked: { type: string, examples: ["*****678"] }
        email: { type: string, format: email }
    Account:
      type: object
      required: [id, alias, type, currency, numberMasked, availableBalance, accountingBalance]
      properties:
        id: { type: string, examples: ["ACC-001"] }
        alias: { type: string, examples: ["Cuenta Sueldo"] }
        type: { type: string, enum: [SAVINGS, CHECKING] }
        currency: { type: string, examples: ["PEN"] }
        numberMasked: { type: string, examples: ["****4821"] }
        availableBalance: { $ref: "#/components/schemas/Money" }
        accountingBalance: { $ref: "#/components/schemas/Money" }
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
    Category:
      type: string
      enum: [GROCERIES, RESTAURANTS, TRANSPORT, SHOPPING, SERVICES, HEALTH, ENTERTAINMENT, SALARY, TRANSFER, INVESTMENT]
    Movement:
      type: object
      required: [id, accountId, date, description, category, amount, type]
      properties:
        id: { type: string, examples: ["MOV-002-0001"] }
        accountId: { type: string, examples: ["ACC-002"] }
        date: { type: string, format: date-time, examples: ["2026-11-06T14:32:00-05:00"] }
        description: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        amount:
          $ref: "#/components/schemas/Money"
          description: "Con signo: negativo en los `DEBIT`."
        type: { type: string, enum: [DEBIT, CREDIT] }
    MovementPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        nextCursor: { type: [string, "null"] }
    Counterparty:
      type: object
      required: [name, reference]
      properties:
        name: { type: string, examples: ["Luis Ramírez"] }
        reference: { type: string, examples: ["999-0000001-0-01"] }
    MovementDetail:
      allOf:
        - $ref: "#/components/schemas/Movement"
        - type: object
          required: [operationNumber, channel, status, counterparty]
          properties:
            operationNumber: { type: string, examples: ["20000001"] }
            channel: { type: string, enum: [POS, ONLINE, APP, ATM, BRANCH] }
            status: { type: string, enum: [COMPLETED] }
            counterparty: { $ref: "#/components/schemas/Counterparty" }
    BreakdownLine:
      type: object
      required: [concept, amount]
      properties:
        concept: { type: string, examples: ["Consumo"] }
        amount: { $ref: "#/components/schemas/Money" }
    Merchant:
      type: object
      required: [name, city]
      properties:
        name: { type: string }
        city: { type: string }
    Breakdown:
      type: object
      description: La suma de `lines`, `fees` y `taxes` es el valor absoluto del monto del movimiento.
      required: [lines, fees, taxes, merchant, category]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/BreakdownLine" }
        fees: { $ref: "#/components/schemas/Money" }
        taxes: { $ref: "#/components/schemas/Money" }
        exchangeRate: { type: string, description: Solo si hubo cambio de moneda., examples: ["3.7520"] }
        merchant:
          oneOf:
            - $ref: "#/components/schemas/Merchant"
            - type: "null"
        category: { $ref: "#/components/schemas/Category" }
    TransferRequest:
      type: object
      required: [sourceAccountId, destinationAccountNumber, amount]
      properties:
        sourceAccountId: { type: string, examples: ["ACC-002"] }
        destinationAccountNumber: { type: string, examples: ["999-0000001-0-01"] }
        amount:
          type: object
          required: [value, currency]
          properties:
            value: { type: string, pattern: "^\\d{1,9}(\\.\\d{1,2})?$", examples: ["150.00"] }
            currency: { type: string, pattern: "^[A-Z]{3}$", examples: ["PEN"] }
        description: { type: string, maxLength: 140 }
    TransferResponse:
      type: object
      required: [transferId, operationNumber, createdAt, sourceAccountId, sourceAvailableBalance, movementId]
      properties:
        transferId: { type: string, examples: ["TRF-000001"] }
        operationNumber: { type: string, examples: ["90000001"] }
        createdAt: { type: string, format: date-time }
        sourceAccountId: { type: string, examples: ["ACC-002"] }
        sourceAvailableBalance: { $ref: "#/components/schemas/Money" }
        movementId: { type: string, examples: ["MOV-002-T0001"] }
    Decimal:
      type: string
      description: Texto decimal; con 2 decimales en precios y porcentajes, con 3 en el tipo de cambio.
      pattern: "^-?\\d+\\.\\d{2,3}$"
    StockQuote:
      type: object
      required: [symbol, name, currency, last, change, changePct, ts]
      properties:
        symbol: { type: string, examples: ["ANDM"] }
        name: { type: string, examples: ["Andina Minerals"] }
        currency: { type: string, const: USD }
        last: { $ref: "#/components/schemas/Decimal", examples: ["42.10"] }
        change: { $ref: "#/components/schemas/Decimal", description: "`last` − `previousClose`.", examples: ["0.34"] }
        changePct: { $ref: "#/components/schemas/Decimal", description: "`change` sobre `previousClose`, en %.", examples: ["0.81"] }
        ts: { type: string, format: date-time, description: Cuándo cambió el precio por última vez. }
    StockList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockQuote" }
    StockDetail:
      allOf:
        - $ref: "#/components/schemas/StockQuote"
        - type: object
          required: [open, high, low, previousClose, volume, description]
          properties:
            open: { $ref: "#/components/schemas/Decimal" }
            high: { $ref: "#/components/schemas/Decimal" }
            low: { $ref: "#/components/schemas/Decimal" }
            previousClose: { $ref: "#/components/schemas/Decimal" }
            volume: { type: integer, examples: [3643000] }
            description: { type: string }
    PricePoint:
      type: object
      required: [ts, price]
      properties:
        ts: { type: string, format: date-time }
        price: { $ref: "#/components/schemas/Decimal" }
    PriceHistory:
      type: object
      required: [symbol, range, currency, points]
      properties:
        symbol: { type: string, examples: ["QORI"] }
        range: { type: string, enum: ["1D", "1W", "1M", "1Y"] }
        currency: { type: string, const: USD }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
    PortfolioHolding:
      type: object
      required: [symbol, name, quantity, averagePrice, lastPrice, marketValue, cost, gain, gainPct, dayChange]
      properties:
        symbol: { type: string, examples: ["ANDM"] }
        name: { type: string }
        quantity: { type: integer, minimum: 1, examples: [10] }
        averagePrice: { $ref: "#/components/schemas/Money" }
        lastPrice: { $ref: "#/components/schemas/Money" }
        marketValue: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        gain: { $ref: "#/components/schemas/Money" }
        gainPct: { $ref: "#/components/schemas/Decimal" }
        dayChange: { $ref: "#/components/schemas/Money" }
    PortfolioTotals:
      type: object
      required: [marketValue, cost, gain, gainPct, dayChange, dayChangePct]
      properties:
        marketValue: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        gain: { $ref: "#/components/schemas/Money" }
        gainPct: { $ref: "#/components/schemas/Decimal" }
        dayChange: { $ref: "#/components/schemas/Money" }
        dayChangePct: { $ref: "#/components/schemas/Decimal" }
    Portfolio:
      type: object
      required: [accountId, currency, holdings, totals]
      properties:
        accountId: { type: string, description: Cuenta en la que se liquidan las órdenes., examples: ["ACC-003"] }
        currency: { type: string, const: USD }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/PortfolioHolding" }
        totals: { $ref: "#/components/schemas/PortfolioTotals" }
    OrderRequest:
      type: object
      required: [symbol, side, quantity, accountId]
      properties:
        symbol: { type: string, examples: ["ANDM"] }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, examples: [2] }
        accountId: { type: string, examples: ["ACC-003"] }
    OrderResponse:
      type: object
      required:
        - orderId
        - operationNumber
        - createdAt
        - side
        - symbol
        - quantity
        - executedPrice
        - total
        - accountId
        - accountAvailableBalance
        - movementId
        - holding
      properties:
        orderId: { type: string, examples: ["ORD-000001"] }
        operationNumber: { type: string, examples: ["70000001"] }
        createdAt: { type: string, format: date-time }
        side: { type: string, enum: [BUY, SELL] }
        symbol: { type: string, examples: ["ANDM"] }
        quantity: { type: integer, examples: [2] }
        executedPrice: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        accountId: { type: string, examples: ["ACC-003"] }
        accountAvailableBalance: { $ref: "#/components/schemas/Money" }
        movementId: { type: string, examples: ["MOV-003-O0001"] }
        holding:
          type: object
          description: La tenencia después de la orden.
          required: [symbol, quantity, averagePrice]
          properties:
            symbol: { type: string }
            quantity: { type: integer, minimum: 0, examples: [12] }
            averagePrice:
              description: "`null` si la tenencia quedó en 0."
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
    FxQuote:
      type: object
      required: [pair, buy, sell, quoteId, expiresAt, ts]
      properties:
        pair: { type: string, const: USD/PEN }
        buy: { $ref: "#/components/schemas/Decimal", examples: ["3.742"] }
        sell: { $ref: "#/components/schemas/Decimal", examples: ["3.768"] }
        quoteId: { type: string, examples: ["QTE-000001"] }
        expiresAt: { type: string, format: date-time }
        ts: { type: string, format: date-time, description: Cuándo se emitió. }
    ExchangeRequest:
      type: object
      required: [quoteId, sourceAccountId, destinationAccountId, amount]
      properties:
        quoteId: { type: string, examples: ["QTE-000001"] }
        sourceAccountId: { type: string, examples: ["ACC-003"] }
        destinationAccountId: { type: string, examples: ["ACC-002"] }
        amount:
          type: object
          description: En la moneda de la cuenta de origen.
          required: [value, currency]
          properties:
            value: { type: string, pattern: "^\\d{1,9}(\\.\\d{1,2})?$", examples: ["100.00"] }
            currency: { type: string, pattern: "^[A-Z]{3}$", examples: ["USD"] }
    ExchangeResponse:
      type: object
      required:
        - exchangeId
        - operationNumber
        - createdAt
        - quoteId
        - rate
        - debited
        - credited
        - sourceAccountId
        - sourceAvailableBalance
        - destinationAccountId
        - destinationAvailableBalance
        - movementIds
      properties:
        exchangeId: { type: string, examples: ["FX-000001"] }
        operationNumber: { type: string, examples: ["80000001"] }
        createdAt: { type: string, format: date-time }
        quoteId: { type: string }
        rate: { $ref: "#/components/schemas/Decimal", examples: ["3.742"] }
        debited: { $ref: "#/components/schemas/Money" }
        credited: { $ref: "#/components/schemas/Money" }
        sourceAccountId: { type: string, examples: ["ACC-003"] }
        sourceAvailableBalance: { $ref: "#/components/schemas/Money" }
        destinationAccountId: { type: string, examples: ["ACC-002"] }
        destinationAvailableBalance: { $ref: "#/components/schemas/Money" }
        movementIds:
          type: array
          description: El del origen y el del destino, en ese orden.
          items: { type: string }
          examples: [["MOV-003-X0001", "MOV-002-X0001"]]
    Biller:
      type: object
      required: [id, name, category, customerCodeFormat]
      properties:
        id: { type: string, examples: ["BIL-LUZ"] }
        name: { type: string, examples: ["Luz del Norte"] }
        category:
          type: string
          description: Rubro de la empresa.
          examples: ["Electricidad"]
        customerCodeFormat:
          type: string
          description: Expresión regular que debe cumplir el código de cliente.
          examples: ["^\\d{6}$"]
    BillerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Biller" }
    BillDebt:
      type: object
      required: [id, period, dueDate, amount]
      properties:
        id: { type: string, examples: ["DEB-LUZ-202610"] }
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", examples: ["2026-10"] }
        dueDate: { type: string, format: date, examples: ["2026-11-12"] }
        amount: { $ref: "#/components/schemas/Money" }
    BillHistoryLine:
      type: object
      required: [concept, amount, detail]
      properties:
        concept: { type: string, examples: ["Cargo fijo mensual"] }
        amount: { $ref: "#/components/schemas/Money" }
        detail: { type: string, examples: ["Cargo por cliente"] }
    BillHistoryMonth:
      type: object
      description: Un mes facturado y pagado; `amount` es la suma de `lines`.
      required: [period, amount, paidAt, lines]
      properties:
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", examples: ["2026-09"] }
        amount: { $ref: "#/components/schemas/Money" }
        paidAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BillHistoryLine" }
    BillerDebts:
      type: object
      required: [customerName, debts]
      properties:
        customerName: { type: string, examples: ["Ana Torres"] }
        debts:
          type: array
          description: Recibos pendientes, del más antiguo al más reciente; vacío si no hay.
          items: { $ref: "#/components/schemas/BillDebt" }
        history:
          type: array
          description: Solo con `includeHistory=true`. Últimos 24 meses, del más antiguo al más reciente.
          items: { $ref: "#/components/schemas/BillHistoryMonth" }
    BillPaymentRequest:
      type: object
      required: [billerId, customerCode, debtIds, accountId, pin]
      properties:
        billerId: { type: string, examples: ["BIL-LUZ"] }
        customerCode: { type: string, examples: ["100200"] }
        debtIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
          examples: [["DEB-LUZ-202610", "DEB-LUZ-202611"]]
        accountId: { type: string, examples: ["ACC-002"] }
        pin:
          type: string
          pattern: "^\\d{4}$"
          description: Clave de operaciones de 4 dígitos.
          examples: ["1234"]
    PaidDebt:
      type: object
      required: [id, period, amount]
      properties:
        id: { type: string, examples: ["DEB-LUZ-202610"] }
        period: { type: string, examples: ["2026-10"] }
        amount: { $ref: "#/components/schemas/Money" }
    BillPaymentResponse:
      type: object
      required:
        - paymentId
        - operationNumber
        - createdAt
        - paidDebts
        - total
        - accountId
        - accountAvailableBalance
        - movementId
      properties:
        paymentId: { type: string, examples: ["PAY-000001"] }
        operationNumber: { type: string, examples: ["80000001"] }
        createdAt: { type: string, format: date-time }
        paidDebts:
          type: array
          items: { $ref: "#/components/schemas/PaidDebt" }
        total: { $ref: "#/components/schemas/Money" }
        accountId: { type: string, examples: ["ACC-002"] }
        accountAvailableBalance: { $ref: "#/components/schemas/Money" }
        movementId: { type: string, examples: ["MOV-002-P0001"] }
    BiometricEnrollResponse:
      type: object
      required: [deviceToken]
      properties:
        deviceToken: { type: string, description: Opaco. Guárdalo cifrado en el dispositivo. }
    BiometricLoginRequest:
      type: object
      required: [deviceToken]
      properties:
        deviceToken: { type: string }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: ["amount.value"] }
        code: { type: string, examples: ["MUST_BE_POSITIVE"] }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457.
      required: [type, title, status, detail, code, traceId]
      properties:
        type: { type: string, format: uri, examples: ["https://cartera.invalid/problems/insufficient-funds"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - INVALID_CREDENTIALS
            - INVALID_DEVICE
            - SESSION_EXPIRED
            - UNAUTHORIZED
            - NOT_FOUND
            - VALIDATION_ERROR
            - INSUFFICIENT_FUNDS
            - DESTINATION_NOT_FOUND
            - CURRENCY_MISMATCH
            - INSUFFICIENT_HOLDINGS
            - QUOTE_EXPIRED
            - BILLER_NOT_FOUND
            - CUSTOMER_NOT_FOUND
            - PAYMENT_NOT_FOUND
            - INVALID_PIN
            - DEBT_ALREADY_PAID
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        traceId: { type: string, description: Igual al `X-Request-Id` de la respuesta. }
        errors:
          type: array
          description: Solo en `VALIDATION_ERROR`.
          items: { $ref: "#/components/schemas/FieldError" }
        quote:
          $ref: "#/components/schemas/FxQuote"
          description: Solo en `QUOTE_EXPIRED`, la cotización nueva.
