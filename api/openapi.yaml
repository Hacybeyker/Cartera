openapi: 3.1.0
info:
  title: Cartera API
  version: 1.0.0
  summary: Billetera digital de demo.
  contact:
    name: Hacybeyker
    url: https://github.com/Hacybeyker/Cartera
    email: contacto@cartera.invalid
  license:
    name: MIT
    identifier: MIT
  description: |
    Contrato del backend de Cartera. En debug y demo lo sirve un backend embebido en la app
    (`http://127.0.0.1:8765/api/v1/`); en release apunta a un marcador que no resuelve
    (`https://cartera.invalid/api/v1/`), así que migrar a un servidor real es cambiar solo `BASE_URL`.
    La guía para implementarlo (NestJS, Spring o Node) es `docs/CONTRATO.md`.

    **Versión.** SemVer, ver `api/CHANGELOG.md`: un cambio que rompe a los clientes existentes sube la
    MAJOR; un endpoint, un campo opcional o un código de error nuevos, la MINOR; una corrección de
    texto o de ejemplos, la PATCH.

    **Ejemplos.** Cada respuesta trae ejemplos con nombre tomados de los fixtures (`api/fixtures/`); el
    primero es el que devuelve un mock generado desde este archivo (por ejemplo, Prism). Un test de la app
    comprueba que los ejemplos de éxito coinciden con lo que responde el backend embebido desde datos
    limpios (los recortados lo dicen en su resumen).

    **Convenciones**
    - JSON en camelCase. Ids como texto.
    - Fechas ISO 8601 con zona (`2026-11-06T14:32:00-05:00`).
    - Montos como texto decimal con moneda ISO 4217 (`{"value":"150.00","currency":"PEN"}`).
    - Toda respuesta trae `X-Request-Id`: el del cliente si lo envió, o uno generado.
    - Errores con cuerpo RFC 9457 (`application/problem+json`), ver `Problem`.
    - Paginación por cursor: `?cursor=&limit=` (1 a 1000, 20 por defecto) responde
      `{ items, nextCursor }`, en orden de fecha descendente, con `nextCursor` en `null` al final.
      El cursor apunta al último elemento entregado, no a una posición: un movimiento nuevo no
      desplaza las páginas.

    **Mercado.** Ocho acciones ficticias cotizadas en USD. Los precios de las acciones y el tipo de
    cambio USD/PEN avanzan por una secuencia de ticks pregenerados con semilla (`fixtures/market/ticks/`
    y `fixtures/fx/rates.json`): el primero es el precio inicial y, al agotarse, se vuelve a empezar
    desde el primero. Los endpoints REST devuelven siempre el tick vigente del servidor; el canal en
    vivo (`/market/stream`, WebSocket, descrito en `asyncapi.yaml`) lo hace avanzar al intervalo de
    `X-Demo-Tick-Ms`, y con 0 los precios quedan congelados. Los precios de mercado viajan como texto
    decimal en la moneda de `currency` (`"42.10"`); los porcentajes, con 2 decimales (`"1.25"` = 1,25 %).
    Las órdenes, el portafolio y el cambio usan `Money`. Los montos calculados se redondean a 2
    decimales, mitad hacia arriba.

    **Autenticación.** `Authorization: Bearer <JWT>`, HS256 con claims `sub`, `iat` y `exp`
    (TTL por defecto: 900 s). La clave de demo es pública a propósito: `cartera-demo-hs256-key-2026-not-a-secret`.
    No hay refresh token.

    **Entornos de demo.** El servidor honra estas cabeceras opcionales y nada más; el cliente
    decide sus valores:

    | Cabecera | Valores | Efecto |
    |---|---|---|
    | `X-Demo-Latency-Ms` | entero ≥ 0 | Retrasa la respuesta, sin jitter. |
    | `X-Demo-Failure-Rate` | 0–100 | Porcentaje de llamadas que fallan, con semilla fija. |
    | `X-Demo-Failure-Mode` | `http_500` · `timeout` · `disconnect` | Cómo falla: 500 `INTERNAL_ERROR`, sin respuesta, o cierre del socket. |
    | `X-Demo-Session-Ttl` | segundos | Solo en el login: TTL del token emitido. |
    | `X-Demo-Backend-Down` | `true` | 503 `SERVICE_UNAVAILABLE` con `Retry-After` en todos los endpoints. |
    | `X-Demo-Quote-Ttl-S` | segundos > 0 (30) | En `GET /fx/rates` y en el handshake del canal: vigencia de la cotización emitida. |
    | `X-Demo-Tick-Ms` | entero ≥ 0 (2000) | Solo en el handshake del canal: milisegundos entre ticks; 0 congela los precios. |
    | `X-Demo-Stream-Drop-S` | entero ≥ 0 (0) | Solo en el handshake del canal: segundos hasta que el servidor corta la conexión; 0 = nunca. |

    `X-Demo-Session-Ttl` también rige en `POST /auth/biometric/login`. Un valor inválido equivale a
    no enviar la cabecera (entre paréntesis, el valor que rige entonces).

    Las de latencia y fallos aplican igual a todos los endpoints, incluido el handshake del canal.
    `POST /_demo/reset` no aplica ninguna. El estado (saldos, movimientos, tenencias, precios vigentes,
    cotizaciones, recibos pagados e idempotencia) vive en memoria y vuelve a los fixtures al reiniciar el proceso o con
    ese endpoint. La excepción son los dispositivos registrados para ingresar con huella: sobreviven al
    reinicio del proceso (el ingreso con huella sirve en los arranques siguientes) y solo los borran
    `POST /_demo/reset`, `DELETE /auth/biometric` o borrar los datos de la app.

    **Idempotencia.** `POST /transfers`, `POST /orders`, `POST /fx/exchanges` y `POST /bill-payments`
    exigen `Idempotency-Key`. La clave vale por usuario y por operación: repetirla devuelve la misma
    respuesta 201 sin volver a ejecutar, aunque cambie el cuerpo. Las respuestas de error no se
    guardan, así que la misma clave se puede reintentar.

    **Pago de servicios.** Veinte empresas por rubro (`GET /billers`). Cada una publica el formato de
    su código de cliente (`customerCodeFormat`, una expresión regular) y, por código, los recibos
    pendientes en soles (`GET /billers/{billerId}/debts`). Un recibo pagado deja de aparecer. El pago
    exige la clave de operaciones de la persona (`INVALID_PIN`) y deja una constancia en HTML
    (`GET /bill-payments/{paymentId}/voucher`). Los montos del pago son `Money` en PEN.
servers:
  - url: http://127.0.0.1:8765/api/v1
    description: Backend embebido (debug y demo)
  - url: https://api.cartera.example/api/v1
    description: Servidor de ejemplo, sin desplegar
security:
  - bearer: []
tags:
  - name: app
  - name: auth
  - name: profile
  - name: accounts
  - name: movements
  - name: transfers
  - name: market
  - name: portfolio
  - name: orders
  - name: fx
  - name: bills
  - name: biometric
  - name: demo
paths:
  /app/config:
    get:
      tags: [app]
      operationId: getAppConfig
      summary: Configuración que lee la splash.
      description: |
        No pide token. La splash la lee al arrancar: `minSupportedVersion` es la versión mínima de la app que
        el servidor acepta y `termsVersion` identifica los términos y condiciones vigentes; si cambia, la app
        los vuelve a mostrar.
      security: []
      responses:
        "200":
          description: Configuración vigente.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
              examples:
                configuracion:
                  summary: "La configuración vigente."
                  value: { minSupportedVersion: "0.1.0", termsVersion: "2026-11-01" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y devuelve un JWT.
      description: |
        Valida usuario y contraseña, ambos obligatorios (`VALIDATION_ERROR` por campo si faltan o vienen
        vacíos). Un par que no coincide da `INVALID_CREDENTIALS`, sin decir cuál de los dos falló. Devuelve un JWT
        HS256 con los claims `sub`, `iat` y `exp` y `expiresIn` en segundos (900 por defecto). No hay refresh
        token: al vencer, hay que volver a iniciar sesión.
      security: []
      parameters:
        - $ref: "#/components/parameters/DemoSessionTtl"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              ana:
                summary: "La usuaria de prueba."
                value: { username: "ana.torres", password: "Cartera2026" }
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                sesion:
                  summary: "Token de 900 s para Ana Torres."
                  value:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJVU1ItMDAxIiwiaWF0IjoxNzk0MDYzNjAwLCJleHAiOjE3OTQwNjQ1MDB9.ZTHmmPDY0J0Oh53Tvhrp4fnRUEiYRh0b2aurJ1CyrVQ"
                    tokenType: "Bearer"
                    expiresIn: 900
        "401":
          description: "`INVALID_CREDENTIALS`: usuario o contraseña incorrectos."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                credencialesInvalidas:
                  summary: "Usuario o contraseña incorrectos."
                  value:
                    type: "https://cartera.invalid/problems/invalid-credentials"
                    title: "Credenciales inválidas"
                    status: 401
                    detail: "Usuario o contraseña incorrectos."
                    code: "INVALID_CREDENTIALS"
                    traceId: "req-000001"
        "422":
          description: "`VALIDATION_ERROR`, con un elemento en `errors[]` por campo."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                camposObligatorios:
                  summary: "Faltan el usuario y la contraseña."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "Faltan datos para iniciar sesión."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors:
                      - { field: "username", code: "REQUIRED", message: "El campo es obligatorio." }
                      - { field: "password", code: "REQUIRED", message: "El campo es obligatorio." }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me:
    get:
      tags: [profile]
      operationId: getMe
      summary: Perfil de la persona autenticada.
      description: |
        Datos de la persona a la que pertenece el token (`sub`). El documento viaja enmascarado.
      responses:
        "200":
          description: Perfil.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              examples:
                ana:
                  summary: "El perfil de la usuaria de prueba."
                  value:
                    id: "USR-001"
                    fullName: "Ana Torres"
                    documentMasked: "*****678"
                    email: "ana.torres@cartera.invalid"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Cuentas propias.
      description: |
        Las cuentas de la persona, con su saldo disponible y contable al momento de la llamada. Una
        transferencia, una orden, un cambio o un pago de servicios cambia el saldo disponible de la cuenta
        afectada.
      responses:
        "200":
          description: Cuentas.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
              examples:
                cuentas:
                  summary: "Las tres cuentas de Ana, con los saldos iniciales."
                  value:
                    items:
                      - id: "ACC-001"
                        alias: "Cuenta Sueldo"
                        type: "SAVINGS"
                        currency: "PEN"
                        numberMasked: "****4821"
                        availableBalance: { value: "8450.75", currency: "PEN" }
                        accountingBalance: { value: "8450.75", currency: "PEN" }
                      - id: "ACC-002"
                        alias: "Cuenta Gastos"
                        type: "CHECKING"
                        currency: "PEN"
                        numberMasked: "****9034"
                        availableBalance: { value: "2300.00", currency: "PEN" }
                        accountingBalance: { value: "2300.00", currency: "PEN" }
                      - id: "ACC-003"
                        alias: "Cuenta Dólares"
                        type: "SAVINGS"
                        currency: "USD"
                        numberMasked: "****1177"
                        availableBalance: { value: "1050.20", currency: "USD" }
                        accountingBalance: { value: "1050.20", currency: "USD" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /accounts/{accountId}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Una cuenta propia.
      description: |
        Una cuenta de la persona. Si el id no existe o es de otra persona, responde 404 `NOT_FOUND`.
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, examples: ["ACC-001"] }
      responses:
        "200":
          description: Cuenta.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              examples:
                cuentaSueldo:
                  summary: "Cuenta Sueldo."
                  value:
                    id: "ACC-001"
                    alias: "Cuenta Sueldo"
                    type: "SAVINGS"
                    currency: "PEN"
                    numberMasked: "****4821"
                    availableBalance: { value: "8450.75", currency: "PEN" }
                    accountingBalance: { value: "8450.75", currency: "PEN" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`NOT_FOUND`: el id no existe o no es de la persona."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                cuentaNoExiste:
                  summary: "La cuenta no existe o no es de la persona."
                  value:
                    type: "https://cartera.invalid/problems/not-found"
                    title: "Recurso no encontrado"
                    status: 404
                    detail: "No se encontró la cuenta ACC-999."
                    code: "NOT_FOUND"
                    traceId: "req-000001"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /movements:
    get:
      tags: [movements]
      operationId: listMovements
      summary: Movimientos paginados, de una cuenta o de todas.
      description: |
        Paginación por cursor, en orden de fecha descendente (con el id como desempate). Sin `accountId` trae
        los movimientos de todas las cuentas propias. `limit` va de 1 a 1000 (20 por defecto). El cursor es el
        `nextCursor` de la página anterior y apunta al último movimiento entregado, no a una posición; un
        cursor que no corresponde a la lista da 422 `VALIDATION_ERROR` en el campo `cursor`. Una cuenta que no
        es de la persona da 422 en el campo `accountId`.
      parameters:
        - name: accountId
          in: query
          description: Sin este parámetro trae los movimientos de todas las cuentas propias.
          schema: { type: string, examples: ["ACC-001"] }
        - name: cursor
          in: query
          description: El `nextCursor` de la página anterior.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 20 }
      responses:
        "200":
          description: Una página.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementPage" }
              examples:
                sinMasPaginas:
                  summary: "Los movimientos más recientes de ACC-001, sin más páginas."
                  value:
                    items:
                      - id: "MOV-001-0001"
                        accountId: "ACC-001"
                        date: "2026-11-06T18:45:00-05:00"
                        description: "Compra Fibra Hogar Internet"
                        category: "SERVICES"
                        amount: { value: "-169.61", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0002"
                        accountId: "ACC-001"
                        date: "2026-11-06T09:43:00-05:00"
                        description: "Compra Cine Estelar"
                        category: "ENTERTAINMENT"
                        amount: { value: "-36.55", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0003"
                        accountId: "ACC-001"
                        date: "2026-11-05T21:51:00-05:00"
                        description: "Compra Taxi Seguro"
                        category: "TRANSPORT"
                        amount: { value: "-43.64", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0004"
                        accountId: "ACC-001"
                        date: "2026-11-05T19:08:00-05:00"
                        description: "Compra Agua Clara"
                        category: "SERVICES"
                        amount: { value: "-66.17", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0005"
                        accountId: "ACC-001"
                        date: "2026-11-05T15:04:00-05:00"
                        description: "Compra Pollería La Brasa"
                        category: "RESTAURANTS"
                        amount: { value: "-30.29", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0006"
                        accountId: "ACC-001"
                        date: "2026-11-05T08:45:00-05:00"
                        description: "Compra Cine Estelar"
                        category: "ENTERTAINMENT"
                        amount: { value: "-66.26", currency: "PEN" }
                        type: "DEBIT"
                    nextCursor: null
                conMasPaginas:
                  summary: "Una primera página (`limit=6`) con el cursor de la siguiente."
                  value:
                    items:
                      - id: "MOV-001-0001"
                        accountId: "ACC-001"
                        date: "2026-11-06T18:45:00-05:00"
                        description: "Compra Fibra Hogar Internet"
                        category: "SERVICES"
                        amount: { value: "-169.61", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0002"
                        accountId: "ACC-001"
                        date: "2026-11-06T09:43:00-05:00"
                        description: "Compra Cine Estelar"
                        category: "ENTERTAINMENT"
                        amount: { value: "-36.55", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0003"
                        accountId: "ACC-001"
                        date: "2026-11-05T21:51:00-05:00"
                        description: "Compra Taxi Seguro"
                        category: "TRANSPORT"
                        amount: { value: "-43.64", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0004"
                        accountId: "ACC-001"
                        date: "2026-11-05T19:08:00-05:00"
                        description: "Compra Agua Clara"
                        category: "SERVICES"
                        amount: { value: "-66.17", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0005"
                        accountId: "ACC-001"
                        date: "2026-11-05T15:04:00-05:00"
                        description: "Compra Pollería La Brasa"
                        category: "RESTAURANTS"
                        amount: { value: "-30.29", currency: "PEN" }
                        type: "DEBIT"
                      - id: "MOV-001-0006"
                        accountId: "ACC-001"
                        date: "2026-11-05T08:45:00-05:00"
                        description: "Compra Cine Estelar"
                        category: "ENTERTAINMENT"
                        amount: { value: "-66.26", currency: "PEN" }
                        type: "DEBIT"
                    nextCursor: "TU9WLTAwMS0wMDA2"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "`VALIDATION_ERROR`, con un elemento en `errors[]` por campo."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                limiteFueraDeRango:
                  summary: "`limit` fuera de 1 a 1000."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "Usa un valor entre 1 y 1000."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors: [{ field: "limit", code: "OUT_OF_RANGE", message: "Usa un valor entre 1 y 1000." }]
                cursorInvalido:
                  summary: "El cursor no corresponde a la lista."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "El cursor no corresponde a esta lista."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors: [{ field: "cursor", code: "INVALID", message: "Cursor inválido o vencido." }]
                cuentaAjena:
                  summary: "`accountId` no es una cuenta propia."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "La cuenta no existe o no es tuya."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors: [{ field: "accountId", code: "NOT_OWNED", message: "La cuenta no existe o no es tuya." }]
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /movements/{movementId}:
    get:
      tags: [movements]
      operationId: getMovement
      summary: Detalle de un movimiento.
      description: |
        El movimiento con su número de operación, canal, estado y contraparte. Si no existe o es de una cuenta
        de otra persona, responde 404 `NOT_FOUND`.
      parameters:
        - $ref: "#/components/parameters/MovementId"
      responses:
        "200":
          description: Movimiento.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementDetail" }
              examples:
                detalle:
                  summary: "Detalle del movimiento más reciente de ACC-001."
                  value:
                    id: "MOV-001-0001"
                    accountId: "ACC-001"
                    date: "2026-11-06T18:45:00-05:00"
                    description: "Compra Fibra Hogar Internet"
                    category: "SERVICES"
                    amount: { value: "-169.61", currency: "PEN" }
                    type: "DEBIT"
                    operationNumber: "10000001"
                    channel: "APP"
                    status: "COMPLETED"
                    counterparty: { name: "Fibra Hogar Internet", reference: "VISA ****4821" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`NOT_FOUND`: el id no existe o no es de la persona."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                movimientoNoExiste:
                  summary: "El movimiento no existe o no es de la persona."
                  value:
                    type: "https://cartera.invalid/problems/not-found"
                    title: "Recurso no encontrado"
                    status: 404
                    detail: "No se encontró el movimiento MOV-999."
                    code: "NOT_FOUND"
                    traceId: "req-000001"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /movements/{movementId}/breakdown:
    get:
      tags: [movements]
      operationId: getMovementBreakdown
      summary: Desglose de un movimiento.
      description: |
        Líneas, comisiones, impuestos, comercio y categoría del movimiento. `exchangeRate` solo viaja en los
        movimientos de un cambio de moneda. Si el movimiento no existe o no es de la persona, responde
        404 `NOT_FOUND`.
      parameters:
        - $ref: "#/components/parameters/MovementId"
      responses:
        "200":
          description: Desglose.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Breakdown" }
              examples:
                desglose:
                  summary: "Desglose del mismo movimiento."
                  value:
