                    fees: { value: "0.00", currency: "PEN" }
                    taxes: { value: "25.87", currency: "PEN" }
                    merchant: { name: "Fibra Hogar Internet", city: "Lima" }
                    category: "SERVICES"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`NOT_FOUND`: el id no existe o no es de la persona."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                movimientoNoExiste:
                  summary: "El movimiento no existe o no es de la persona."
                  value:
                    type: "https://cartera.invalid/problems/not-found"
                    title: "Recurso no encontrado"
                    status: 404
                    detail: "No se encontró el movimiento MOV-999."
                    code: "NOT_FOUND"
                    traceId: "req-000001"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /transfers:
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Transfiere a una cuenta de terceros.
      description: |
        **Regla de negocio**, validada en este orden:
        1. `Idempotency-Key` presente y cuerpo válido: monto decimal con hasta dos decimales y
           mayor que cero, moneda ISO 4217, descripción de hasta 140 caracteres (`VALIDATION_ERROR`).
        2. El origen es una cuenta propia (`VALIDATION_ERROR`, campo `sourceAccountId`).
        3. El destino existe entre las cuentas de terceros (`DESTINATION_NOT_FOUND`).
        4. Origen, destino y monto usan la misma moneda (`CURRENCY_MISMATCH`).
        5. 0 < monto ≤ saldo disponible del origen (`INSUFFICIENT_FUNDS`).

        Si pasa, se descuenta el monto del saldo disponible del origen y se agrega un movimiento
        `DEBIT` al inicio de esa cuenta, con un desglose mínimo. No hay comisiones ni ITF.

        Un `Idempotency-Key` repetido devuelve la misma respuesta 201 sin volver a cobrar. Las
        respuestas de error no se guardan: el mismo key se puede reintentar.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, examples: ["3f1c2a9e-7d4b-4b8e-9c55-1a2b3c4d5e6f"] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
            examples:
              aTerceros:
                summary: "150.00 soles de Cuenta Gastos a Luis Ramírez."
                value:
                  sourceAccountId: "ACC-002"
                  destinationAccountNumber: "999-0000001-0-01"
                  amount: { value: "150.00", currency: "PEN" }
      responses:
        "201":
          description: Transferencia hecha.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
              examples:
                transferencia:
                  summary: "La primera transferencia desde datos limpios."
                  value:
                    transferId: "TRF-000001"
                    operationNumber: "90000001"
                    createdAt: "2026-11-07T10:00:00-05:00"
                    sourceAccountId: "ACC-002"
                    sourceAvailableBalance: { value: "2150.00", currency: "PEN" }
                    movementId: "MOV-002-T0001"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: |
            `VALIDATION_ERROR` (con `errors[]`), `INSUFFICIENT_FUNDS`, `DESTINATION_NOT_FOUND`
            o `CURRENCY_MISMATCH`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                saldoInsuficiente:
                  summary: "El monto supera el saldo disponible."
                  value:
                    type: "https://cartera.invalid/problems/insufficient-funds"
                    title: "Saldo insuficiente"
                    status: 422
                    detail: "El monto supera el saldo disponible."
                    code: "INSUFFICIENT_FUNDS"
                    traceId: "req-000001"
                datosInvalidos:
                  summary: "Monto en cero."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "La transferencia tiene datos inválidos."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors:
                      - field: "amount.value"
                        code: "MUST_BE_POSITIVE"
                        message: "El monto debe ser mayor que cero."
                sinClaveDeIdempotencia:
                  summary: "Falta la cabecera `Idempotency-Key`."
                  value:
                    type: "https://cartera.invalid/problems/validation-error"
                    title: "Datos inválidos"
                    status: 422
                    detail: "La transferencia tiene datos inválidos."
                    code: "VALIDATION_ERROR"
                    traceId: "req-000001"
                    errors: [{ field: "Idempotency-Key", code: "REQUIRED", message: "La cabecera es obligatoria." }]
                destinoNoExiste:
                  summary: "No hay una cuenta con ese número."
                  value:
                    type: "https://cartera.invalid/problems/destination-not-found"
                    title: "Cuenta de destino no encontrada"
                    status: 422
                    detail: "No existe una cuenta con ese número."
                    code: "DESTINATION_NOT_FOUND"
                    traceId: "req-000001"
                monedasDistintas:
                  summary: "Soles hacia una cuenta en dólares."
                  value:
                    type: "https://cartera.invalid/problems/currency-mismatch"
                    title: "Las monedas no coinciden"
                    status: 422
                    detail: "El origen, el destino y el monto deben usar PEN."
                    code: "CURRENCY_MISMATCH"
                    traceId: "req-000001"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
